<script type="text/JavaScript"><!--

	//########データ挿入###########################
    //メニュー付いてくる
    $(document).ready(function(){
      $("#stickmenu").sticky({ topSpacing: 0, center:true,});
	});
	
	//グローバル変数にdataとdataLoad宣言
	var gameData =[];
	//var dataLoad = false;

	//画面読み込み
	$(function(){
		loadScreen();
	});
	function loadScreen() {
		$('html,body').animate({ scrollTop: 0 }, 0);
			//JSON読み込み
			$.getJSON('../games/data.json?random=' + Math.random(), function (data){
			gameData = data;
			var id = idGet();
			//初期読み込み時のセット
			screenSet(gameData, id);
			//感想を選択しているか否か
			if(location.hash === '#impression'){
				var target = $('#impression');
				var speed = 0; // ミリ秒
				goScreen(target, speed);								//感想に移動
				history.pushState(true, '', '04_game.html?id=' + id);	//url書き換え
			}
		});
	}

	//ブラウザからの戻る/進む対策
	if (window.history && window.history.pushState){
		$(window).on("popstate",function(event){
			if (!event.originalEvent.state) return; // 初回アクセス時対策
			$(function(){
				loadScreen();
			});
		});
	}

	//簡易ゲーム一覧
	$('[id^="gameList"]').on({
		//マウスオン
		'mouseenter': function(){
			$('#popList').show();
			$('#popList').insertAfter(this);
			//要素内移動
			var position = $('#popList li').eq(idGet()).position().top;
			$('#popList').scrollTop(position);
			//どっちのボタンからか
			if(this.id === 'gameList1'){
				$('#popList').attr('data-area', '');
			}else{
				$('#popList').attr('data-area', 'impression');
			}
		},
		//マウスオフ
		'mouseleave': function(){
			$('#popList').hide();
		},
	});
	$('#popList').on({
		//マウスオン
		'mouseenter': function(){
			$(this).show();
		},
		//マウスオフ
		'mouseleave': function(){
			$(this).hide();
		},
	});
	$('body').on({
		//クリック
		'click': function(){
			//データ読み込み、画面更新
			var id = $(this).index();
			screenSet(gameData, id);								//画面セット
			history.pushState(true, '', '04_game.html?id=' + id);	//url書き換え
			//下のボタンから行ったら感想に合わせる
			if($('#popList').attr('data-area') === 'impression'){
				var speed = 0;
				var target = $('#impression');
				goScreen(target, speed);
			}
		},
	},'#popList li');

	//ゲーム番号アップダウン
	$('[id^="gameUp"], [id^="gameDown"]').on('click', function(){
		//アップかダウンか
		if(!this.id.indexOf('gameUp')){
			var id = idGet() + 1 ;
		}else{
			var id = idGet() -1 ;
		}

		//感想欄を上にするか否か
		if(this.id === 'gameUp2' || this.id === 'gameDown2'){
			var target = $('#impression');
		}else{
			var target = false;
		}
		//データ読み込み、画面更新
		screenSet(gameData, id);								//画面セット
		history.pushState(true, '', '04_game.html?id=' + id);	//url書き換え
		if(target){
			var speed = 0;
			goScreen(target, speed);
		}
	});

	//移動
	$('[id^="Go"]').on('click', function(){
		// 移動先を取得(id名から"Go"を抜き、セレクタに代入)
		var target = $('#' + $(this).attr('id').replace('Go', ''));
		var speed = 400; // ミリ秒
		goScreen(target, speed);
	});

	function goScreen(target, speed){
		// 移動先を数値で取得
		var position = target.offset().top;
		// スムーススクロール
		$('html, body').animate({scrollTop:position}, speed, 'swing');
		return false;		
	}

	//urlからkeyを取得
	function idGet(){
		var arg  = new Object;
		var url = location.search.substring(1).split('&');
		
		for(var i = 0; url[i]; i++) {
			var k = url[i].split('=');
			arg[k[0]] = k[1];
		}
		var id = arg.id - 0;

		//文字列だったらidに0を代入
		if(isNaN(id)){
			id = 0;
		}
		//切り捨て整数化
		id = Math.floor(id);
		return id;
	}

	//画面内容セット
	function screenSet(data, id){

		var num = data['num'];	//作品数

		//idが0～numまででなければ0を代入
		if(id < 0 || id > num){
			id = 0;
			history.pushState(true, '', '04_game.html?id=' + id);	//url書き換え
		}
		
		//noセット
		if(id <= 9){
			var no = '0' + id;
		}else{
			var no = id;
		}
		//iconの拡張子が指定されていなければicon.pngを入れる
		if(data[id]['iconext'] == ''){
			var icon = '../img/games/icon.png';
		}else{
			var icon = '../img/games/' + id + '-icon.' + data[id]['iconext'];
		}
		//MVのブラウザ
		if(data[id]['browser'] == 1){
			var tkooltype = data[id]['tkool'] + ' /ブラウザ希望';
		}else{
			var tkooltype = data[id]['tkool'];
		}
		//投票
		if(data[id]['vote'] == 1){
			var votecomment = "可";
		}else{
			var votecomment = "不可";
		}		

		//作品番号が0ならば「前の作品へ」を表示しない
		if(id <= 0){
			$('[id^="gameDown"]').css('visibility', 'hidden');
		}else{
			$('[id^="gameDown"]').css('visibility', 'visible');
		}		
		//作品番号が末尾ならば「次の作品へ」を表示しない
		if(id >= num){
			$('[id^="gameUp"]').css('visibility', 'hidden');
		}else{
			$('[id^="gameUp"]').css('visibility', 'visible');
		}

		//値代入
		$("title").text('紅白No' + no);
		$('[id^="gameNo"]').text(no);
		$('[id^="gameTitle"]').text('読み込み中・・・');
		$('#author').text(data[id]['author']);
		$('#genre').text(data[id]['genre']);
		$('#tkool').text(tkooltype);
		$('#dandm').text(data[id]['dandm']);
		$('#vote').text(votecomment);
		$('#comment').html(nl2br(data[id]['comment']));
		$('#comment2').html(nl2br(data[id]['comment2']));

		//提出済みの場合DLボタン表示
		if(data[id]['link1'] != ''){
			$('[id^="gameDl1"]').html('ﾀﾞｳﾝﾛｰﾄﾞ<br>' + data[id]['capa']);
			$('[id^="gameDl2"]').html('ﾀﾞｳﾝﾛｰﾄﾞ ' + data[id]['capa']);
			$('[id^="gameDl"]').data('num', id);
			$('[id^="gameDl"]').data('link', data[id]['link1']);
			$('[id^="gameDl"]').css('visibility', 'visible');
		}else{
			$('[id^="gameDl"]').css('visibility', 'hidden');
		}
		//Web版表示表示
		if(data[id]['link2'] != ''){
			$('[id^="gameWeb"]').css('visibility', 'visible');
			$('[id^="gameWeb"]').data('num', id);
			$('[id^="gameWeb"]').data('link', data[id]['link2']);
		}else{
			$('[id^="gameWeb"]').css('visibility', 'hidden');
		}
		//提出日と最終更新日
		if(data[id]['date1'] != ''){
			$('#date1').text(data[id]['date1']);
		}else{
			$('#date1').text('');
		}
		if(data[id]['date2'] != ''){
			$('#date2').text(data[id]['date2']);
		}else{
			$('#date2').text('');
		}

		//アイコンとファビコン
		$('#gameIcon').attr('src', icon);
		$('#fabicon').attr('href', icon);
		
		//ss2枚目があるかないかで画像の出力を変える
		if(data[id]['ss2ext']){
			$('#gameSs').attr({
				'src': '../img/games/' + id + '-1.' + data[id]['ss1ext'],
				'onmouseover': 'this.src="../img/games/' + id + '-2.' + data[id]['ss2ext'] + '"',
				'onmouseout': 'this.src="../img/games/' + id + '-1.' + data[id]['ss1ext'] + '"',
			});
			$('#ss2Comment').css('visibility', 'visible');
			$('#ss1Return').css('visibility', 'visible');
			$('#ss1Return').attr('onclick', '#gameSs.src="../img/games/' + id + '-1.' + data[id]['ss1ext'] + '"');

			//ss2枚目をプリロード
			$('<img>').attr('src', '../img/games/' + id + '-2.' + data[id]['ss2ext']);

		}else{
			$('#gameSs').attr({
				'src': '../img/games/' + id + '-1.' + data[id]['ss1ext'],
				'onmouseover': '',
				'onmouseout': '',			
			});
			$('#ss2Comment').css('visibility', 'hidden');
			$('#ss1Return').css('visibility', 'hidden');
			$('#ss1Return').attr('onclick', '');
		}

		//マーカー設定
		setMark(id);

		//フォーム設定
		//初期化
		formClear();

		//タイトル1セット（掲示板以外読み込み終了）
		$('#gameTitle1').text(data[id]['title']);

		//掲示板リンク及びセット
		if(data[id]['board']){
			var url = 'http://jbbs.shitaraba.net/bbs/read.cgi/game/60350/' + data[id]['board'] + '/';
			$('#board1, #board2').attr('href', url);
			var url = 'http://jbbs.shitaraba.net/bbs/rawmode.cgi/game/60350/' + data[id]['board'] + '/';
			$('#board1, #board2').css('visibility', 'visible');
			setBoard(url);
		}else{
			$('#board1, #board2').css('visibility', 'hidden');
			$('#impressBoard').html('');				//掲示板データ空に
		}

		//タイトル2セット（掲示板読み込み終了）
		$('#gameTitle2').text(data[id]['title']);

		//リスト
		var listText = '<ul>';
		for(var i = 0; i <= num; i++){
			if(i == id){
				listText += '<li value="' + i + '" style="background-color:gray;">' + data[i]['title'] + '</li>';
			}else{
				listText += '<li value="' + i + '">' + data[i]['title'] + '</li>';
			}
		}
		listText += '</ul>';
		$('#popList').html(listText);
	}

	//改行phpのnl2br
	function nl2br(str) {
		str = str.replace(/\r\n/g, "<br />");
		str = str.replace(/(\n|\r)/g, "<br />");
		return str;
	}

	//マーカー設定
	function setMark(id){
		//マーカーを一度リセット
		$('a[id^="mark"]').attr('class', 'button3');
		if($.cookie('check')){
			//クッキーが存在時のみ行う
			var cvalue = $.cookie('check');
			//クッキーから必要な値を読み取りリストにセット
			var val = cvalue.substr(id, 1);
			$('#mark' + val).attr('class', 'button4');		
			//ボタンに反映
		}
	}

	//マーカー変更
	$('a[id^="mark"]').on('click', function(){
		//ボタン変更
		$('a[id^="mark"]').attr('class', 'button3');
		$(this).attr('class', 'button4');

		if(!$.cookie('check')){
			//クッキーが存在しない場合、まずは値をセット
			var cvalue = '';		
			//255文字0を続ける
			for (var i = 0; i < 255; i++){
				cvalue += '0';
			}
		}else{
			//クッキー存在する場合は値をそのまま変数にセット
			var cvalue = $.cookie('check');
		}
		//変更した作品番号と、値を取得
		var num = idGet();
		var value = $(this).attr('data-value');
		//値を書き換え
		cvalue = cvalue.slice(0, num) + value + cvalue.slice(num + 1);
		//クッキー書き込み		
		$.cookie('check', cvalue, { expires: 365 });

	});

	//#############PIAI########################
	//DL
	$('body').on('click', '[id^="gameDl"]', function(){
		//作品番号取得し、クッキーとカウンターの確認
		var num = $(this).data('num');
		var type = 'dl';
		setCount(num, type);
		//DLページに飛ばす
		window.location.href = $(this).data('link');
	});
	//Web
	$('body').on('click', '[id^="gameWeb"]', function(){
		//作品番号取得し、クッキーとカウンターの確認
		var num = $(this).data('num');
		var type = 'web';
		setCount(num, type);
		//Webページに飛ばす
		window.location.href = $(this).data('link');
	});

	function setCount(num, datatype){
		if(!$.cookie(datatype)){
			//クッキーが存在しない場合、まずは値をセット
			var cvalue = '';		
			//255文字0を続ける
			for (var i = 0; i < 255; i++){
				cvalue += '0';
			}
		}else{
			//クッキー存在する場合は値をそのまま変数にセット
			var cvalue = $.cookie(datatype);
		}

		//初DLの場合≒クッキーの値が0の場合、カウントする
		var val = cvalue.substr(num, 1);
		if(val !== '1'){
			//受け渡し用データ
			var postData = { no: num, type: datatype };
			//カウント用のphpにデータ受け渡し
			/*$.ajax({
				type: "POST",
				url: "05_dl.php",
				data: postData
			});*/
		}
		//クッキー書き込み		
		var value = 1;
		cvalue = cvalue.slice(0, num) + value + cvalue.slice(num + 1);
		$.cookie(datatype, cvalue, { expires: 365 });
	}

	//#############投票########################

	//投票開閉2及びデーターをクッキーに代入
	$('[name=userAge]').on('change', function(){
		if($(this).val() == '' || $('[name=gender]:checked').val() == undefined){
			$('#userVoteB').hide('slow');
		}else{
			$('#userVoteB').show('slow');
		}
		setUserData('age', $(this).val());
	});
	$('[name=gender]').on('change', function(){
		if($('[name=userAge]').val() != ''){
			$('#userVoteB').show('slow');
		}
		setUserData('gender', $(this).val());
	});
	$('#gender2').on('change', function(){
		if($('[name=userAge]').val() != ''){
			$('#userVoteB').show('slow');
		}
		if($(this).val() == 0){
			setUserData('gender', 0);
		}else if($(this).val() == 100){
			setUserData('gender', 1);
		}else{
			setUserData('gender', 4);
		}
		setUserData('gender2', $(this).val());
	});

	function setUserData(datatype, value){
		//$.cookie.json = true;これいらない
		if(!$.cookie('userdata')){
			//クッキーが存在しない場合、まずは値をセット
			var cvalue = [false,false,false,false,false];	
			//255文字0を続ける
		}else{
			//クッキー存在する場合は値をそのまま変数にセット
			var cvalue = decodeURI($.cookie('userdata'));
			cvalue = cvalue.replace(/"/g, '');
			cvalue = cvalue.split(',');
		}
		if(datatype == 'age'){
			cvalue[1] = value;
		}else if(datatype == 'gender'){
			cvalue[2] = value;
		}else if(datatype == 'gender2'){
			cvalue[3] = value;
		}
		//alert(value);

		//クッキー書き込み		
		$.cookie('userdata', cvalue, { expires: 365 });
	}

	//ユーザーデータ入っているとき
	if($.cookie('userdata')){
		var covalue = decodeURI($.cookie('userdata'));
		covalue = covalue.replace(/"/g, '');
		covalue = covalue.split(',');
		$('[name=userAge]').val(covalue[1]);
		$('[name=gender]').val([covalue[2]]);
		$('#gender2').val(covalue[3]);
		if(covalue[1] != '' && covalue[2] != ''){
			$('#userVoteB').show('slow');
		}
		if(covalue[1] != '' && covalue[2] == 4){
			$('#male').text((100 - $('#gender2').val()) + '%');
			$('#female').text($('#gender2').val() + '%');
		}
	}

	//性別
	$('#gender2').on('input', function(){
		$('#male').text((100 - $(this).val()) + '%');
		$('#female').text($(this).val() + '%');
		if($(this).val() == 0){
			$('[name=gender]').val([0]);
			$('#male').text('');
			$('#female').text('');
		}else if($(this).val() == 100){
			$('[name=gender]').val([1]);
			$('#male').text('');
			$('#female').text('');
		}else{
			$('[name=gender]').val([4]);
		}
	});

	//性別
	$('[name=gender]').on('click', function(){
		if($(this).val() == 0){
			$('#gender2').val([0]);
		}else if($(this).val() == 1){
			$('#gender2').val([1]);
		}else if($(this).val() == 4){
			$(this).val([]);
		}
		$('#male').text('');
		$('#female').text('');
	});

	//投票初期化
	function vDel(){
		$('[name^="v"]').val([]);
		$('[id^="subBtn"]').prop('disabled', true);
		$('[id^="subBtn"]').css('visibility', 'hidden');
		$('[id^="subBtn"]').css('display', 'inline');
		$('[id^="subCom"]').text('');
	}

	//ラジオボタン選択時に送信ボタンを選択可能にする
	$('[name^="v"]').on('click', function(){
		var btnnum = $(this).attr('name');
		btnnum = btnnum[1];
		$('#subBtn' + btnnum).prop('disabled', false);
	});

	//投票ボタン
	$('[id^="subBtn"]').on('click', function(){
		var gamenum = idGet();
		var btnnum = $(this).attr('id');
		btnnum = btnnum[6];
		var pointa = $('[name=v' + btnnum +']:checked').val();
		//alert(gamenum + ', ' + btnnum + ', ' + point);

		//ボタン消去
		$('#subCom' + btnnum).text('投票済(' + pointa + '点)');
		$('#subCom' + btnnum).css('color', 'red');
		$('#subBtn' + btnnum).css('display', 'none');

		//サーバーに送信
		//ユーザー情報
		if($.cookie('userdata')){
			var userdata = decodeURI($.cookie('userdata'));
			userdata = userdata.replace(/"/g, '');
			userdata = userdata.split(',');
			//alert(userdata[1]+  ', ' + userdata[2] + ', ' + userdata[3]);
		}else{
			var userdata = [false,false,false,false,false];	
		}
		var us1 = userdata[1];
		var us2 = userdata[2];
		var us3 = userdata[3];

		//受け渡し用データ
		var postData = { no: gamenum, type: btnnum, point: pointa, u1: us1, u2: us2, u3: us3};
		//カウント用のphpにデータ受け渡し
		/*$.ajax({
			type: "POST",
			url: "06_vote.php",
			data: postData
		});*/

		//クッキーに代入
		if(!$.cookie('vote')){
			//クッキーが存在しない場合、まずは値をセット
			var cvalue;		
			//255×10回0を続ける
			for (var i = 0; i < 255; i++){
				cvalue += '0000000000';
			}
			$.cookie('vote', cvalue, { expires: 365 });
		}//else{
			//クッキー存在する場合は値をそのまま変数にセット
			var cvalue = $.cookie('vote');
		//}
		//変更した作品番号と、値を取得
		var num = gamenum  + btnnum + '';	//文字扱いにすることを明確化
		num = Number(num);					//数値に変換
		//値を書き換え
		cvalue = cvalue.slice(0, num) + pointa + cvalue.slice(num + 1);
		//alert(num);
		//クッキー書き込み		
		$.cookie('vote', cvalue, { expires: 365 });
	});

	//投票済みを反映
	function setVoteEnd(id){
		if($.cookie('vote')){
			//クッキーが存在時のみ行う
			var cvalue = $.cookie('vote');
			//idから該当箇所のデータを抽出
			var num;
			for(var i = 0; i < 10; i++){
				num = cvalue[id * 10 + i];
				if(num != 0){
					$('#subCom' + i).text('投票済(' + num + '点)');
					$('#subCom' + i).css('color', 'red');
					$('#subBtn' + i).css('display', 'none');
				}
			}
		}
	}

	//マーカー設定
	function setComEnd(id){
		//ボタンリセット
		$('#comTemp').prop('disabled', false);
		$('#comSub').prop('disabled', false);
		$('#comSub').text('送信する');
		if($.cookie('comment')){
			//クッキーが存在時のみ行う
			var cvalue = $.cookie('comment');
			//クッキーから必要な値を読み取りリストにセット
			var val = cvalue.substr(id, 1);
			if(val == '1'){
				$('#comTemp').prop('disabled', true);
				$('#comSub').prop('disabled', true);
				$('#comSub').text('送信済み');
			}
		}
