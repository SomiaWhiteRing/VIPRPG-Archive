敵が居座っていることが多く、戦闘の回避が非常に難しいのも少々問題に思いました。逃走の簡略化の側面を持つシンボルエンカウントを採用しているのに避けられない敵がいて、なのに逃走率は100%、とちょっとどっちつかずな部分があります。\u003cbr>また、マップの導線がはっきりしていないので「この先に宝箱があるな」「強敵がいそうだな」などの予測がつかず、若干進みづらさを感じました。\u003cbr>宝箱もあまり設置されているわけではないため、敵シンボルの隣をすり抜けて進むことに腐心してしまう設計は大変惜しいです。\u003cbr>しかしながら戦闘面に関しては、古き良きコマンド戦闘に必要十分に手が加えられ、確りとした戦略性を持ったものに仕上がっている良作でした。\u003cbr>ブライアン、お前ただの肉壁かと思ったらめちゃくちゃ優秀なバッファーじゃないか……。そしてデイジーいなくてよかった……。\u003c/details>\u003c/div>"},{"icon":"af5c6921bdb3d377a63da258.png","ss":["0bd0d4bb6c025b6f62c36b5b.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1587509049/l1000","a_com":"\u003cdiv class=\"source-comment\">アレックスは無敵状態のときは虹色に光るべき\u003cbr>\u003cbr>\u003cdetails>\u003csummary>プレイ後感想追記（クリックで開く）\u003c/summary>\u003cbr>なんで全員光ってるんだよ！！見づらいわ！！！\u003cbr>ビカビカ光るのではなくゆっくりと色が変わっていくのが絶妙なゲーミングの再現ですね。\u003cbr>でもゲーミングってなんだよ。\u003c/details>\u003c/div>"},{"icon":"default_icon.png","ss":["8aa9ad442e9daf2ec8e1ece2.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1587509079/l1000","a_com":"\u003cdiv class=\"source-comment\">シリアスな読むゲーかな？これは期待\u003cbr>\u003cbr>\u003cdetails>\u003csummary>プレイ後感想追記（クリックで開く）\u003c/summary>\u003cbr>頼れる物が何もないとき、精神的な支柱がどこにあるのかに焦点を当てた話。\u003cbr>泣いたり折れたりしないだけではなく、慕ってくれる誰かがいるというのも強さの一つです。\u003cbr>それも他人の痛みを感じられるある種の弱さがあればこそのものですね。\u003cbr>で、借金は？\u003c/details>\u003c/div>"},{"icon":"4ee307d78121c1f3a1532ba8.png","ss":["8a6a1b7927acbb13880db0c6.png","9dcbbe4acdcab0ccf01df69f.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1587509100/l1000","a_com":"\u003cdiv class=\"source-comment\">自分で戦えるナビ妖精というのも乙なものですね\u003cbr>\u003cbr>\u003cdetails>\u003csummary>プレイ後感想追記（クリックで開く）\u003c/summary>\u003cbr>ひとまずピースを全て集めて一周クリア。\u003cbr>アイテムの隠し方が難しすぎず簡単すぎずでとても良かったです。\u003cbr>見落としがあっても難なくカバーできる親切設計もあり苦もなくクリアすることができました。\u003cbr>本来重要な立ち位置であるはずの絵本の主人公の子が割とぽっと出で、本作のストーリーのアクシデンタルな面を強調しているように感じます。\u003cbr>マップのコンセプトがしっかりしていてテンポよく進められる中、いきなり出てくる間のエリアで緩急を付けてきたのも面白い部分です。\u003cbr>チャートが作りやすい構成なのでRTA実績にも気軽にチャレンジできそうですね。\u003c/details>\u003c/div>"},{"icon":"default_icon.png","ss":["0186dbb29f5afd301a0302c3.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1587509128/l1000","a_com":"\u003cdiv class=\"source-comment\">内容がまったく予想できない……。\u003cbr>\u003cbr>\u003cdetails>\u003csummary>プレイ後感想追記（クリックで開く）\u003c/summary>\u003cbr>これはいいドタバタ。外食に行くだけなのになんでこんなメチャクチャになるのかわからんｗｗｗ\u003cbr>人外の家族喧嘩は一味違いますね。ショウじゃなきゃ完全に死んでいます。\u003cbr>エアカレーは勢いから出たでまかせかと思いきや本人も信じ込んでるのこわい。ちゃんとしたものを参考にせず間違った方向に努力してしまうことは誰にでもあることだと思いますが、ここまで地獄に向けて一直線に突っ走れるのはヤバすぎますね。鳥なのに視野がすごくせまそう。\u003cbr>魔ーミンは久しぶりに見ましたね……。割と好きなキャラなのにあまり使われなくてちょっと悲しいですが、見た目があれなので仕方ない。今回は憎めない良い悪役をやっていました。\u003cbr>そしてえまりーが街中でも普通に湧くの草。\u003c/details>\u003c/div>"},{"icon":"1ecb628727d02d2e29a549a0.png","ss":["07f978fbc22fb6b40a822796.jpg"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1587570538/l1000","a_com":"\u003cdiv class=\"source-comment\">ふりーむがそんな状況に……。\u003cbr>\u003cbr>\u003cdetails>\u003csummary>プレイ後感想追記（クリックで開く）\u003c/summary>\u003cbr>ダイスロールができるツール。スタイリッシュなビジュアルが目を惹きます。\u003cbr>出てくる目の頻度を均等にそろえようとするバランスモードが面白いです。\u003cbr>一方で一度に複数ダイスを振れなかったり、プロファイルをひとつしか保存できなかったり。キーが非常に滑りやすいのもちょっと残念。\u003cbr>\u003c/details>\u003c/div>"},{"icon":"3113336c494549ffb7affaa6.gif","ss":["7853d36f3c0a7145c655df85.gif"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1587570569/l1000","a_com":"\u003cdiv class=\"source-comment\">´ｌヮｌ`\u003cbr>\u003cbr>\u003cdetails>\u003csummary>プレイ後感想追記（クリックで開く）\u003c/summary>\u003cbr>タイトル画面がいちいちうるせぇ！ｗｗｗｗ\u003cbr>各話にReadmeが付いている（読まなくても支障はない）のが面白いです。\u003cbr>ドッペルゲンガーと話しても気が狂わない人っているんですね。\u003cbr>世界征服の話が一番面白かったです。寝る前さんによるWORLDさんの紹介がクソすぎて笑った。\u003cbr>頭が弱い二人の話をうまく舵きりする寝る前さんの手管には素で唸らせられました。流石は年長者。\u003cbr>ところでじいちゃんの（略）は9世代目なのでは……？\u003c/details>\u003c/div>"},{"icon":"39a9b3ef5ad9d7f5cb6981cd.png","ss":["752082a4304ad967d2e96c4b.png","55f9c3b06d34b08b5d4e0969.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1587686350/l1000","a_com":"\u003cdiv class=\"source-comment\">本当に遅すぎてワロタ\u003cbr>\u003cbr>\u003cdetails>\u003csummary>プレイ後感想追記（クリックで開く）\u003c/summary>\u003cbr>話しかけるべきキャラにアイコンが出ていて素早く見分けがつくため、さくさくと進められるところが良かったです。\u003cbr>意欲的なシステムを多数積んでいるのですが、戦闘周りは正直なところ調整不足感が否めません。\u003cbr>会話は何やら前提知識が要求されるので全体的に追いてけぼりにされたり、初見では健全ほのぼのといった雰囲気だったのに突然出てくるド下ネタにびっくりさせられたりと没入しづらさがありました。\u003cbr>短いながらに登場キャラがとても多く、お祭りゲー感はとても出ていたと思います。\u003c/details>\u003c/div>"},{"icon":"b7b6ff40020c9a01df8bd053.png","ss":["4950cf28cd39010aeefc0221.png","524069a9948d938feda9fc0d.png","4084301ca85510d256a70cc8.png","0ec5b4d4ea568bb16cb3c402.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1587884025/l1000","a_com":"\u003cdiv class=\"source-comment\">ようこそようこそ。SSから気合が入っているのが見て取れますね\u003cbr>\u003cbr>\u003cdetails>\u003csummary>プレイ後感想追記（クリックで開く）\u003c/summary>\u003cbr>とある箱庭世界の中と外を舞台とした見るゲ。まだ制作途中のようですが、これから話が大きく広がっていく雰囲気を感じます。\u003cbr>この世界の残酷な真実（ホモ本であること）を知って、登場人物たちがどんな反応を取るかこれから楽しみですね。\u003cbr>キャラクターの掛け合いが軽妙で、かつ個々の描写がしっかりとされており、各人物の立ち位置が掴みやすかったです。\u003cbr>ただし、含みのあるセリフの多さに対してUI面の洗練が足りていないため、やや伝わりづらい所が散見されました。立ち絵がちかちかと点滅したり、立ち絵でほとんど画面が塞がっているのにマップがスクロールしたり、と作り込みが若干甘かったかも。\u003cbr>ストーリーは非常に興味深いですが、過去の視点に頻繁に飛ぶために話の進みが遅く感じやすいかなと。広範のキャラを使ったことで勢力の説明が多くなり、話の流れが強引になっている印象も否めません。\u003cbr>はい説の設定を随所に挿入すると内輪っぽさが却って増してしまうため、劇中の描写でそれとなく説明した方がVIPRPGを知らない人には優しかったのではないかと思いますが、あくまでVIPRPGの外からVIPRPGを描くというコンセプトは大変面白いと感じました。\u003cbr>でも仮にも悪の組織の代表の前で「キャロルとデートするから抜けるぜ！」は流石にあんまりじゃないかな……。\u003c/details>\u003c/div>"},{"icon":"default_icon.png","ss":["ffd1fddfce2e7a3643255037.png","c17fee0981893539e6ef7fd9.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1587999881/l1000","a_com":"\u003cdiv class=\"source-comment\">R.I.P. プレイヤー\u003cbr>\u003cbr>\u003cdetails>\u003csummary>プレイ後感想追記（クリックで開く）\u003c/summary>\u003cbr>前作は楽しめる拷問でしたが、これは苦行度が高すぎて面倒になってしまったので断念。\u003cbr>マップ移動した先に毎回棘が置いてあるのでとても疲労が溜まります。\u003cbr>考えたら何か新しい解法を発見できたり、段階的に複雑化していく操作の上達を楽しめたりとかそういうのはなく、ひたすら微妙に難しい暗算やらされてる感じ。\u003cbr>せめて視覚的な楽しみがもう少し欲しかったかなと思います。\u003c/details>\u003c/div>"},{"icon":"23345730ed5f8a348dda7b27.png","ss":["ffb8b9c3e07d3856e804afce.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1588104417/l1000","a_com":"\u003cdiv class=\"source-comment\">このzipひとつでやるゲー、講座ゲー、素材ゲーが無料で遊べちまうんだ！\u003cbr>\u003cbr>\u003cdetails>\u003csummary>プレイ後感想追記（クリックで開く）\u003c/summary>\u003cbr>素材集はかわいい系からおぞましい系、アフロ短剣使い系までかなり幅が広いです。こちらに迫ってきてる感じの戦闘グラフィックはとても使いたくなりますね。\u003cbr>デフォ戦はノーマルでクリアしました。とても戦闘向きには見えないパーティがあの手この手で戦っている感じが良かったです。\u003cbr>攻撃を外したら次の攻撃が強化されるパッシブスキルは損な感じを軽減していてなるほどと思いましたが、あまりにも命中率が酷いので結局スレッジハンマーはほとんど使いませんでした……。リジェネも使わなかったけどハードでは出番があるのかな？\u003cbr>小ネタ集、というか小技集は実演式で大変分かりやすかったです。「作るのめんどくさかったら最低限の演出でもええんやで」という所までフォローしているのは親切すぎてちょっと笑った。\u003c/details>\u003c/div>"},{"icon":"60fff7b3b116f29a688d052c.png","ss":["fb8127d6f6ec4fc23c009981.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1588172672/l1000","a_com":"\u003cdiv class=\"source-comment\">処女受胎を題材にした神聖なエロゲと見た\u003cbr>\u003cbr>\u003cdetails>\u003csummary>プレイ後感想追記（クリックで開く）\u003c/summary>\u003cbr>笑いすぎて頭がおかしくなるところでした。\u003cbr>性器同士がむにむに動いてお互いを取り込むのもヤバいし、2倍の母体で胎児の成長速度が10倍なのもヤバいです。原作者の方はM字開脚をキープし続けるのが辛いと思ったのか無理やり1/10の時間に縮めた感がある気がしますが、それでもなお出産までの一か月をM字開脚で向き合って過ごすのは恐らくかなり大変でしょうね。\u003cbr>ストーリーの量はほぼ無に等しく、正直言って原作の設定を使って投げやりにエロシーン作ってみた感が強いです。特に、女の子同士で膣融合しないと出られないプレハブが突然現れたあたりはもうちょっとフォローのしようがあったんじゃないかと思いました。\u003cbr>他にも臍の緒は二本あるのか途中から二股になっているのかとか、あの動くベッドを使ったとしても性器の結合部の上に尿道口があるのだから排尿は無理があるんじゃないかとか色々気になることは多かったのですが、やはり一番気になったのはCGの画質の低さです。どうかニアレストネイバー以外の補間法を使って縮小してください……。\u003c/details>\u003c/div>"},{"icon":"db170de2a1f8a6f2648110e8.png","ss":["c5ee65deda3e4f62afd02123.png","f7a9e9ff383b4e7221f4657b.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1588277292/l1000","a_com":"\u003cdiv class=\"source-comment\">ksg詰め合わせにコレクター要素を付け加えるだけで俄然ゲーム性が増すように感じられますね\u003cbr>\u003cbr>\u003cdetails>\u003csummary>プレイ後感想追記（クリックで開く）\u003c/summary>\u003cbr>ギャラリーそのものを探索するというのはなかなか斬新。トロフィー屋はそれなりに利用させて頂きました。それでも140個台止まりですが……。\u003cbr>一番好きなｋｓｇは不死身のウィンディでした。ヒール先生のセリフと間違い電話が地味にツボってしまった。\u003cbr>FF7オマージュは力入ってるのか手抜きなのかわからなくて混乱しました。アルテマ連打。\u003cbr>探索アイテム集め系が多くて作者の好みがよくわかりますね。一つだけかと思ったら三つくらい入ってた。\u003cbr>マップを探索することに集中していると「け」が見つからないのほんま……。\u003cbr>ヴェクサシオンの隠し場所は単純ながら汚ねーぞ！となりました。エリック・サティとジョン・ケージはクソ（条件反射）\u003cbr>アクション系・自作システム系は正直どれも操作感が悪かったかも。キー入力周りがもっさりしていてスコアを伸ばすのが大変でした。先行入力とかあったらよかったかもしれませんね。\u003cbr>まさかのバックストーリーはえぐみのあるメタ要素でとても良かったです。実話じゃないと聞いてほっとしたような、少しがっかりしたような……。\u003cbr>ゲーム制作はなるべく楽しくやれたらいいなと思う反面、鬱屈した感情と退廃的な背景から生み出されるものもたまには在っていいかも、と不謹慎ながら考えてしまいました。\u003c/details>\u003c/div>"},{"icon":"912f57c70c81aaab2e448bfe.png","ss":["c28e010e46a96f3123f9e0ea.png","632f73f591ad784f8d9d0985.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1588277313/l1000","a_com":"\u003cdiv class=\"source-comment\">完成待ってたやつ。退廃的な雰囲気が大変好みです\u003cbr>\u003cbr>\u003cdetails>\u003csummary>プレイ後感想追記（クリックで開く）\u003c/summary>\u003cbr>全エンド見てクリア。レベルは30くらいまで上げました。\u003cbr>エンド4は流石に反則過ぎて爆笑せざるを得なかった。ただ、若干作品の雰囲気を壊してしまったかなという感じはあります。救いと破滅が両立したエンド2が一番好みですね。\u003cbr>裏ボス関連以外は一貫した語りと、全体を通した救われなさ・重苦しさがとても良かったです。雪道ゲーの窮屈さ・閉塞感も作品のコンセプトとうまくかみ合っているように感じます。ラスボスがなんか小物っぽかった気がしましたが、まあ所詮は帝国の操り人形にして中間管理職だったというところでしょう（？）\u003cbr>戦闘バランスはラスボスが（裏ボスドロップの武器が強すぎたためか）やや弱かったように感じましたが、それ以外は演出の凄みも相まってとても緊張感があります。ちょっと属性関連が複雑だったのでReadmeを隣に開きながらプレイしました。もう少し属性は絞ってもよかったかもしれませんね。\u003cbr>女神転生の退廃的なテイストは私も好きです。三面ボスの男のあれみたいなえげつない行為がしれっと行われているのもすごくメガテンっぽい。\u003cbr>作品を通したメッセージとしてはやはり「つらくても決して諦めないこと」でしょうか。光芒、つまりか細い光の筋を懸命に捉え、闇の中を渡り歩いていく強さをいつだって持ちたいものです。至極残念なことに、進んだ先にある光によって照らされた真実は残酷だったりもするのですが、まあ、その時はその時ということでね（海に飛び込む）。\u003cbr>総じてしっかりとした一貫性を感じた良作でした。\u003c/details>\u003c/div>"},{"icon":"30df1c63696791fa46d05f5e.png","ss":["f782656a311d227e4345268b.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1588277334/l1000","a_com":"\u003cdiv class=\"source-comment\">半裸の鳥のお姉さんに給餌してもらえる場所はここですか\u003cbr>\u003cbr>\u003cdetails>\u003csummary>プレイ後感想追記（クリックで開く）\u003c/summary>\u003cbr>ほのぼのした魔王把握。ほのぼのだっつってんっだろ！（ゴメスから目を逸らしながら）\u003cbr>オブジェクトひとつひとつにコメントが入っているのは正直驚きました。マップの出来もよく手間が掛かっていることが伺えます。\u003cbr>全体的にゆるい雰囲気ですが、いつの間にか増殖してるおぱんつや滅びたエルフ族などほのぼので隠しきれないヤバさがにじみ出てて笑いを誘います。\u003cbr>インプのカップル（？）は背中を押してくっつけてあげるのかなと思いきや……。\u003cbr>ストレートに求婚したのに断られるハー妹で草。なんでやハー妹かわいいやろ！何もしないところとか！\u003cbr>それにしてもこのフィールドBGMは某ローグライクRPGを思い出してしまいますね……。\u003c/details>\u003c/div>"},{"icon":"93e2fb0aa413f337b7bfb5a5.png","ss":["84cdfe00f78d2963b3813677.png","e1463627e697de2225b44e6e.png","81aead01aa4880625748d178.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1588363861/l1000","a_com":"\u003cdiv class=\"source-comment\">馬ケツ\u003cbr>\u003cbr>\u003cdetails>\u003csummary>プレイ後感想追記（クリックで開く）\u003c/summary>\u003cbr>ロレックス超覚醒編。見るゲの途中で魔王把握が始まるのは面白かったです。\u003cbr>魔法具現化は使いようによってはかなりおいしい設定だなと思っているのですが、「実は過去の人物だった」はその最たるものだなと。\u003cbr>ただ、いきなりピンポイントな人物が具現化として発生するのはやや都合がいいというべきか、あるいは因果がアーケンに嫌がらせをしているというべきか……。いずれにせよ馬部分が分離してしまったのはちょっと残念でした（突然の個人的嗜好）\u003cbr>間合いを無視するテレポート斬り、剣技としては強くないわけがないんですが見た目は果てしなく地味ですね……。\u003c/details>\u003c/div>"},{"icon":"default_icon.png","ss":["9c08d3b63a44ecc79623ba04.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1588363906/l1000","a_com":"\u003cdiv class=\"source-comment\">むしろフレーバーテキストを書きたいからやるゲ作るみたいなとこある\u003cbr>\u003cbr>\u003cdetails>\u003csummary>プレイ後感想追記（クリックで開く）\u003c/summary>\u003cbr>フレーバーテキストと一口に言っても台詞系・説明系・ポエム系と色々ありますね。\u003cbr>性質を言い表したものもいいですが、個人的にはバックストーリーを感じさせるものが好みです。短くて端的であればなおいい。\u003cbr>アーサーのテキストが一番好きでした。ツクールやってるとつくづく思いますが、物語は上手い形にして伝える人がいなければ始まりませんね。\u003c/details>\u003c/div>"},{"icon":"default_icon.png","ss":["379a987130ac3068fc7daac9.png","420e0df08dc0ae6a9c07a0a9.png","1de2ad10d1401a6db77041db.png","196ca9157275ab4bea2bdc30.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1588462811/l1000","a_com":"\u003cdiv class=\"source-comment\">nexeで実行ファイル化とかできないかな？ちなみにこのサイトもnode.jsで動いています。\u003cbr>\u003cbr>\u003cdetails>\u003csummary>プレイ後感想追記（クリックで開く）\u003c/summary>\u003cbr>ツクールでは大変な画像のインポートを楽にしてくれるツール。画像の透明色の指定だけでなく結合とか分割とかもできるみたいですね。\u003cbr>nodeやgitの環境構築は比較的楽な方とはいえ、未経験の人にはやはり大変なので詳しい説明があるのはありがたいです。ドット二つ重ねてしまうとかよくあるミスもカバーしててワロタ。\u003cbr>画像の透明色を全て統一するのは大変なので、(0, 0)の色を透明色に使う設定などもあればよかったかなと思いました。\u003cbr>大規模な制作を行おうとすると効率化のために何かと自作ツールを開発する必要に駆られてプログラミングをかじるのは正直あるあるですが、ゲームまるごとプログラムで書くよりはツクールで作った方が手間がかからないからギリギリ本末転倒ではないですよ！たぶん！\u003c/details>\u003c/div>"},{"icon":"default_icon.png","ss":["default_ss1.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1588462838/l1000","a_com":"\u003cdiv class=\"source-comment\">死のコロナホモ、スペースゴメス\u003cbr>\u003cbr>\u003cdetails>\u003csummary>プレイ後感想追記（クリックで開く）\u003c/summary>\u003cbr>なんだこれｗｗｗｗｗｗｗｗｗｗｗｗｗｗｗ\u003cbr>あまりにもシュールすぎて変な笑いが止まらなくなりました。っていうかウィンディになってオナニーするやつ他のGW作品でも見たけど流行ってんの！？！？\u003cbr>マップのディテールが雑なのと繋がりがおかしいのが逆に悪夢感出てて良かったです。コロナでもただの風邪でも咳が出てるならマスクを付けて外出しよう！\u003c/details>\u003c/div>"},{"icon":"92405b3b7fcba54a038e4cf0.png","ss":["ebae7b310c26875cc475e5fa.jpg","9f2b977c16439e1a441d8384.jpg"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1588612757/l1000","a_com":"\u003cdiv class=\"source-comment\">あれごめ鬱SS\u003cbr>\u003cbr>\u003cdetails>\u003csummary>プレイ後感想追記（クリックで開く）\u003c/summary>\u003cbr>アレックスの能天気さ（オブラートに包んだ表現）がいちいちゴメスをえぐってて草。\u003cbr>ゴメス……お前……女……なのか……？いやでもゴメスって苗字だから名前はベアトリスとかカタリナとかかもしれないしな……（混乱）\u003cbr>女性器と肛門はこの世界では同じものなのかもしれません。総排泄孔か？\u003c/details>\u003c/div>"},{"icon":"f955c6ecc70cd6b54518c081.png","ss":["7030b8f11aa2eff30f8c38ff.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1588866922/l1000","a_com":"\u003cdiv class=\"source-comment\">SSから漂う穏やかな雰囲気。\u003cbr>\u003cbr>\u003cdetails>\u003csummary>プレイ後感想追記（クリックで開く）\u003c/summary>\u003cbr>ほぼ1マップだけのシンプルな探索ゲー。\u003cbr>ルート自体は非常に短いのですが、同じオブジェクトを何度も調べないと見つからないタイプのイベントを自力で見つけられた試しがないのでヒントをガン見することになりました。\u003cbr>医者が病気や怪我を治して人の命を救うのと、クローンで死者を復活させるのは何が違うのか。善と悪、エゴイズムとアルトゥルイズムの境界はどこにあるのか。ある種古典的ながら答えを出しにくい疑問が浮かびますが、突然のだくねくで全てが吹き飛びました。やめろォ！\u003c/details>\u003c/div>"},{"icon":"dc21ded71e4e3c3bc96713ff.png","ss":["1973ec1e80adfafe18443386.png","bceb1da766fc26e1f6a362fa.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1588957858/l1000","a_com":"\u003cdiv class=\"source-comment\">レオパルト1が4台でレオパルト4（タンク違い）\u003c/div>"},{"icon":"default_icon.png","ss":["d927d807f19082806761d6fd.png","dc0d7e4c60001c49ec1ae85a.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1589147022/l1000","a_com":"\u003cdiv class=\"source-comment\">なるほど、こういうツクールの使い方もあるんですね。\u003cbr>\u003cbr>\u003cdetails>\u003csummary>プレイ後感想追記（クリックで開く）\u003c/summary>\u003cbr>ツクールでコンシューマの再現はよくありますが、過去のツクールゲーの再現というのはかなり珍しいですね。\u003cbr>エントリー後すぐに管理人もざっとVectorの2000ゲーを全て洗ってみたのですが、部分的に当てはまるゲームはちらほらあったものの挙げられている特徴全てに当てはまるゲームは残念ながら見つかりませんでした。マイナーなフリゲは本当に見つからないですよね……。\u003cbr>ボスが意外と強くてワロタ。再現ゲーだし負けても進むだろうと軽い気持ちで戦ってみたら両方のボスに一回ずつ負けてゲームオーバーになる羽目になりました。\u003cbr>クローンの王女を敵組織に送り込むのは面白いストーリーですね。その手があったか！と思ったけど冷静に考えてみると手段としては割とガバ。\u003c/details>\u003c/div>"},{"icon":"c1f2ecadedea5f229cf4b8c7.png","ss":["ed67e2b0ef5d653bf3326804.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1589211962/l1000","a_com":"\u003cdiv class=\"source-comment\">善意の第三者・購入代行サービスと言い換えてもなお十分に胡散臭い。\u003c/div>"},{"icon":"dc753a1cb4d3e9e3a1cb448c.png","ss":["a497783b4b2e094fe418df8d.png","f978003da41753f232161888.png","c73b46109fe4c289c7c2980f.png","ca52a3888a394c817bcda88d.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1589211992/l1000","a_com":"\u003cdiv class=\"source-comment\">静かに暮らしたい系主人公が増えている昨今\u003cbr>\u003cbr>\u003cdetails>\u003csummary>プレイ後感想追記（クリックで開く）\u003c/summary>\u003cbr>シンプルで親切なデフォ戦ゲー。主人公もシンプルに迷惑被っててかわいそう。\u003cbr>裏ボス含めノーマルでクリア。ボスに弱点クリティカルが入って1ターンで死んで唖然とすることもありましたが、ハード以降は（裏ボスが）なかなかきつい難易度のようです。ブラックホール連射しないで！\u003cbr>助けに応じてくれる三人いいやつだな～って一瞬思いかけたけど騙されないですからね。\u003c/details>\u003c/div>"},{"icon":"be9791820288a49b094e536f.png","ss":["de36468f5a2abd63efce80d3.png","97e06873b39d294364cf113f.png","9463f8eb973ff9119006975a.png","d2e5a6c18ab3a0a3ad712992.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1589483103/l1000","a_com":"\u003cdiv class=\"source-comment\">ズル過ぎて100%その場ですり抜けてしまいます（広告）\u003cbr>\u003cbr>\u003cdetails>\u003csummary>プレイ後感想追記（クリックで開く）\u003c/summary>\u003cbr>予告映像的な何か。登場キャラがかなり多いようでシナリオはなかなか複雑そうです。\u003cbr>元となった具現化でしか倒せないって強すぎない？いったいその力はどこから来ているのか……。\u003cbr>銭湯でのシームレスな着替えに感心。異国でも構わず露出するウィンディさん最低ですよ！\u003c/details>\u003c/div>"},{"icon":"1cb928d9c03974f88dd3b75e.png","ss":["379a8198504cd7f9c4500192.png","81062aaaf9672dc3d55192a9.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1589483133/l1000","a_com":"\u003cdiv class=\"source-comment\">ここのコメントもいつも考えて書いてはいるけど実はあんまり書くことが無(((((((\u003cbr>\u003cbr>\u003cdetails>\u003csummary>プレイ後感想追記（クリックで開く）\u003c/summary>\u003cbr>いわゆるｋｓｇコレクションですね。ウィンディとウェンディは同じ顔グラで喋らないで！\u003cbr>ダイスじゃんけん、結局数字を比べるだけだからファンブルとかクリティカルとか全く意味なくて草……。\u003cbr>改行の位置が中途半端なのが気になりました。\u003c/details>\u003c/div>"},{"icon":"default_icon.png","ss":["022c5669a91ac3135dc4d796.jpg","6a51aabf85a7f237f6ce3337.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1589483186/l1000","a_com":"\u003cdiv class=\"source-comment\">&lt;3\u003c/div>"},{"icon":"c3d3c5655becce118b326c18.png","ss":["c412ca5986430ebce42b9bdf.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1589560491/l1000","a_com":"\u003cdiv class=\"source-comment\">戦闘アニメは作るの面倒なのでこういう素材集はありがたいですね\u003cbr>\u003cbr>\u003cdetails>\u003csummary>プレイ後感想追記（クリックで開く）\u003c/summary>\u003cbr>膨大な量の戦闘アニメ集。乱れ雪月花がある……。\u003cbr>確かに2000のようなフロントビューで使う場合にはエフェクトが小さすぎて使いづらそうですが、サイドビューのゲームを作るなら心強い味方ですね。\u003cbr>戦闘アニメの作り方の丁寧な説明もついています。\u003cbr>オープニングの会話がちょっと長くて草。\u003c/details>\u003c/div>"},{"icon":"default_icon.png","ss":["6880e6bb42725d94fa996abc.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1589560507/l1000","a_com":"\u003cdiv class=\"source-comment\">tanasinn...\u003cbr>\u003cbr>\u003cdetails>\u003csummary>プレイ後感想追記（クリックで開く）\u003c/summary>\u003cbr>ヘビゲームと聞いて最初ピンと来ませんでしたがプレイしてみたらなるほど、これは懐かしい……。インベーダーも合わせて懐かしさで殴ってくる……。\u003cbr>普通にヘビゲームしてたのは最初だけで後は避けゲー。ループ画面にする発想が面白いです。\u003cbr>ボタンおしっぱで常に加速出来たらよかったなと思います（後半は要らなくなりますが）。\u003c/details>\u003c/div>"},{"icon":"default_icon.png","ss":["cc27fe2e77eb7d63576b8de8.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1589560537/l1000","a_com":"\u003cdiv class=\"source-comment\">がんばって！\u003c/div>"},{"icon":"aa874917239d8a73bf21560e.png","ss":["2467734bd2ec9685595e1f6e.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1589560559/l1000","a_com":"\u003cdiv class=\"source-comment\">Nintendo Switchも入れておいて\u003cbr>\u003cbr>\u003cdetails>\u003csummary>プレイ後感想追記（クリックで開く）\u003c/summary>\u003cbr>約170種類のキャラクターのぬいぐるみが用意されているユーフォ―キャッチャー。この時点で凄いです。\u003cbr>たぶん160超は取りましたが、種類が多すぎてどれを取り逃しているのかわからないのでひとまずクリアということに。\u003cbr>持ち上げるとRTPのホコグラみたいになるドラゴナスが好きです。アイスニードールはちょっと名前で笑った。\u003c/details>\u003c/div>"},{"icon":"682c1a8ecfa761e5ab5574a9.png","ss":["111a9bacc931f499a0ab748e.png","0ace63fec605940871e14bd6.png"],"forum":"https://jbbs.shitaraba.net/bbs/read.cgi/game/60946/1589560573/l1000","a_com":"\u003cdiv class=\"source-comment\">ならずものっていうかダメそうなパーティで草。\u003cbr>\u003cbr>\u003cdetails>\u003csummary>プレイ後感想追記（クリックで開く）\u003c/summary>\u003cbr>これは……代理ゲーじゃな？　ちょっとした小話の詰め合わせになる予定みたいですね。今のところは一話だけ。\u003cbr>世はインディーズゲーム時代、優秀なエンジンも無料で配布されており凝ったゲームも多く、グラフィックなどの技術も個人レベルでさえ猛烈に上がってきていますね。\u003cbr>そんな中でどうすれば売れるか、プレイしてもらえるかというのは実際非常に難しい話。ゲーム自体の質が良くてもプレイヤーの時間の奪い合いに勝てない可能性は大いにあります。Twitterでの宣伝・進捗報告も大事ですが、付け加えるならインディーズゲームのイベントに積極的に参加した上で、レビューサイトなどに記事を書いてもらう依頼を出すのが一番確実かなと。最近INDIE Live Expoというインディーズ専門の情報番組も配信され始めたようですし、広告を打てる場所は段々と増えています。可能ならパブリッシャーの手も借りたり。\u003cbr>アングラなVIPRPGには直接関係はない話ではありますが、インディーズの動向には注目していきたいところですね。\u003c/details>\u003c/div>"}]}};

    function archiveNavigate(target,value){
      var u=new URL(value,'https://vipgw2020.tubakurame.com/');
      if(u.origin==='https://vipgw2020.tubakurame.com'){
        var name=u.pathname.replace(/^\//,'')||'index.html';
        if(!['index.html','menu.html','entries.html','top.html','about.html','update.html','past.html','entryFail.html','ab.html','archive-closed.html'].includes(name))return;
        parent.postMessage({type:'archive-2020-navigation',target:target,url:location.origin+'/original-pages/2020-gw/'+name+u.search+u.hash},'*');
      }else if(u.protocol==='http:'||u.protocol==='https:'){
        parent.postMessage({type:'archive-2020-navigation',target:'frame2',url:location.origin+'/original-pages/2020-gw/archive-external.html?url='+encodeURIComponent(u.href)},'*');
      }
    }
