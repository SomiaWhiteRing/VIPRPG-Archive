<!DOCTYPE html><html><head><script data-archive-frame-navigation src="archive-frame-navigation.js"></script>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="GENERATOR" content="IBM WebSphere Studio Homepage Builder Version 7.0.0.0 for Windows">
<meta http-equiv="Content-Style-Type" content="text/css">
<title></title>
<script>
          addEventListener('message',function(event){
            var menu=document.querySelector("frame[name=\"left\"]"),main=document.querySelector("frame[name=\"right\"]");
            if(!menu||!main||event.source!==menu.contentWindow||event.data?.type!=='archive-main-navigation')return;
            var url=new URL(event.data.url,location.href);
            if(url.origin===location.origin&&url.pathname.startsWith(location.pathname.slice(0,location.pathname.lastIndexOf('/')+1)))main.src=url.href;
          });
        </script></head>
<frameset cols="200,*" frameborder="NO" border="0">
  <frame name="left" src="fure-m.htm" noresize="">
  <frame name="right" src="ss1.htm">
  <noframes>
  <BODY>
  <P>このページを表示するには、フレームをサポートしているブラウザが必要です。</P>
  </BODY>
  </noframes>
</frameset>
</html>
