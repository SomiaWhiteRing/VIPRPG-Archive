<script src="../js/jquery.js"></script>

<script type="text/JavaScript"><!--

    //メニュー付いてくる/*
    $(document).ready(function(){
      $("#stickmenu").sticky({ topSpacing: 0, center:true,});
    });

    //読み込み
    readResult();
    function readResult(){
        $.when(
            $.getJSON('../games/data.json'),
			//$.getJSON('24_analysis2.php')
			$.getJSON('../games/comment.json')
        )
        .done(function(data, comment){       
            var num = data[0]['num']; //作品数
            
			//ポップリストの生成
			var listText = '<ul>';
			for(var j = 0; j <= num; j++){
				listText += '<li value="' + j + '" id="glist' + j + '">' + data[0][j]['title'] + '</li>';
			}
			listText += '</ul>';
			$('#popList').html(listText);	

            var str = '';
            for(var i = 0; i <= comment[0].length - 1; i++){

				//作品名とそのリンク
				var gn = Number(comment[0][i][0]);

				var gt = '<b><a href="04_game.php?id=' + gn + '">' + data[0][gn]['title'] + '</a></b>';
				str += '<div class="base3" name="game' + gn + '">'
					str += '作品No' + gn;
					str += '：' + gt + '<br>' ;
					str += '年齢：' + comment[0][i][2];
					str += '　性別：' + comment[0][i][3];
					str += '<br><div style="height:5px;"></div>';
					str += comment[0][i][4];
				str += '</div>';
            }

			$('#comment').html(str);

        });
    }

	//作品から絞り込む
	$('[id^="gameList"]').on({
		//マウスオン
		'mouseenter': function(){
			$('#popList').show();
			$('#popList').insertAfter(this);
			//要素内移動
			var position = $('#popList li').eq(idGet()).position().top;
			$('#popList').scrollTop(position);
			//どっちのボタンからか

		},
		//マウスオフ
		'mouseleave': function(){
			$('#popList').hide();
		},
	});
	$('#popList').on({
		//マウスオン
		'mouseenter': function(){
			$(this).show();
		},
		//マウスオフ
		'mouseleave': function(){
			$(this).hide();
		},
	});
	//POPLISTの挙動
	$('body').on({
		//クリック
		'click': function(){
			//データ読み込み、画面更新
			var viewgn = $(this).index();
			var viewgt = $(this).text();
			//$('#popList ').prop('selected');
			//値変更
			$('#viewgn').text(viewgn);
			$('#viewgt').text(viewgt);
			//表示変更
			$('[name^="game"]').hide();
			$('[name="game' + viewgn + '"]').show();

		},
	},'#popList li');

	$('#gameAll').on('click', function(){
		$('[name^="game"]').show();
		$('#viewgn').text('');
		$('#viewgt').text('');
	});

	//次へと前へ
	$('#before').on('click', function(){
		//現在の番号取得
		var now = Number($('#viewgn').text());
		//無表示または0以外なら処理
		if(now !="" & now != 0){
			var newnum = now - 1;
			//値変更
			$('#viewgn').text(newnum);
			//作品名取得
			var title = $('#glist' + newnum).text();
			$('#viewgt').text(title);
			//表示変更
			$('[name^="game"]').hide();
			$('[name="game' + newnum + '"]').show();
		}
	});
	$('#next').on('click', function(){
		//現在の番号取得
		var now = Number($('#viewgn').text());
		//無表示または0以外なら処理
		if(now !="" & now != 70){
			var newnum = now + 1;
			//値変更
			$('#viewgn').text(newnum);
			//作品名取得
			var title = $('#glist' + newnum).text();
			$('#viewgt').text(title);
			//表示変更
			$('[name^="game"]').hide();
			$('[name="game' + newnum + '"]').show();
		}
	});

	$(function(){
		// #で始まるアンカーをクリックした場合に処理
		$('a[href^="#"]').on('click', function(){
			// スクロールの速度
			var speed = 400; // ミリ秒
			// アンカーの値取得
			var href= $(this).attr("href");
			// 移動先を取得
			var target = $(href == "#" || href == "" ? 'html' : href);
			// 移動先を数値で取得
			var position = target.offset().top;
			// スムーススクロール
			$('html, body').animate({scrollTop:position}, speed, 'swing');
			return false;
		});
	});

--></script>
